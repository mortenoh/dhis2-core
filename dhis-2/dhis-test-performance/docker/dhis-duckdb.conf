# DuckDB analytics backend variant of dhis.conf, for A/B runs against the default
# (PostgreSQL analytics) dhis.conf. Pass it with DHIS_CONF_FILE=dhis-duckdb.conf.
#
# The web container also needs HOME pointing at a writable directory, because the
# `postgres` extension is downloaded to ~/.duckdb on first use and is not bundled
# with the JDBC driver. Use the compose override next to this file:
#   COMPOSE_EXTRA_FILE=docker/compose.duckdb.yml

connection.dialect = org.hibernate.dialect.PostgreSQLDialect
connection.driver_class = org.postgresql.Driver
connection.url = jdbc:postgresql://db/dhis
connection.username = dhis
connection.password = dhis

# Analytics tables live in an embedded DuckDB file; the transaction database above is
# attached read-only through the DuckDB `postgres` extension, so no second server is
# involved. The URL must be file-backed - in-memory URLs are rejected at startup.
analytics.database = DUCKDB
analytics.connection.url = jdbc:duckdb:/opt/dhis2/analytics.duckdb

system.update_notifications_enabled = off
